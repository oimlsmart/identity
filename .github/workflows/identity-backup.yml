name: identity-backup

# The account registry's scheduled backup (TODO.identity-ops/03's open
# half — the data lifecycle; the operating plan is docs/deployment/
# identity-operations.md → "Scheduled exports"): every night at 23:41
# UTC (an off-herd minute), export the live D1 registry
# (oiml-smart-platform-identity) as SQL text with the repo's pinned
# wrangler and upload it to the R2 bucket oiml-identity-backups under
# a timestamped key:
#   identity/YYYYMMDD-HHMMZ.sql
#
# Retention is the BUCKET's lifecycle rule, not this workflow: the
# one-time `expire-30-days` rule (prefix `identity/`, objects expire
# 30 days after upload) was applied 2026-09-07 from the operator's
# local credentials (`wrangler r2 bucket lifecycle add
# oiml-identity-backups expire-30-days identity/ --expire-days 30
# --force`; the runbook's scheduled-exports section records it). The
# retention-posture leg below re-asserts the rule's presence every
# night, so a deleted rule alarms instead of silently hoarding. This
# workflow never prunes.
#
# The run verifies its own artifact twice: a sanity gate on the export
# before upload (non-empty, carries CREATE TABLE statements), and a
# read-back after upload (a byte-length compare and a byte-identical
# cmp on the downloaded copy) — a landed-but-corrupt object fails the
# night, never the restore. The restore PATH is the quarterly drill's
# proof, and the drill restores FROM the latest of these snapshots
# (the runbook's DR section), so the R2 path itself is drilled, not
# just the export.
#
# A red run opens (or appends to) the standing issue — the heartbeat's
# report-failure pattern. A failing backup is never silent.
#
# Required GitHub configuration (the one-time OWNER ACTS, the runbook's
# scheduled-exports section): the `cloudflare-identity-backup`
# environment — deliberately WITHOUT required reviewers (a nightly job
# cannot wait on an approval; the production environment's gate would
# stall it) — carrying the two secrets:
#   CLOUDFLARE_ACCOUNT_ID  the estate account id
#   CLOUDFLARE_API_TOKEN   the Cloudflare pilot token (wrangler-
#                          compatible; carries the export AND the R2
#                          object verbs — no S3 key pair anywhere)
# Until the environment carries the two, the guard below fails
# honestly and the standing issue says exactly that.
#
# THE OUTPUT DISCIPLINE, THE PUBLIC-REPO SHAPE: this repository is
# PUBLIC, so a job log is a public surface. The export CONTAINS the
# account registry — the log names the object key, the byte counts,
# and the table count, never the SQL content (no cat, no head, no
# artifact upload).

on:
  schedule:
    # Nightly, 23:41 UTC — off the :00/:30 herd marks.
    - cron: '41 23 * * *'
  workflow_dispatch:

concurrency:
  # Backups serialize and never cancel mid-flight (a cancelled upload
  # could mask a failed night); the timeout bounds a hang.
  group: identity-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: cloudflare-identity-backup
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: oiml-identity-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — the backup posture is provisioned
        run: |
          MISSING=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::the cloudflare-identity-backup environment is missing:$MISSING — the one-time owner provisioning (docs/deployment/identity-operations.md → Scheduled exports) is incomplete."
            exit 1
          fi
          echo "the two credentials are present"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (the pinned wrangler is a dev dep)
        working-directory: browser
        run: npm ci

      - name: Export the live registry (a consistent snapshot, SQL text)
        working-directory: browser
        # The DR drill's own command (docs/deployment/
        # identity-operations.md): run from browser/ so wrangler.toml
        # resolves, the identity env names the live database.
        run: |
          mkdir -p "$RUNNER_TEMP/identity-backup"
          npx wrangler d1 export oiml-smart-platform-identity --remote --env identity \
            --output "$RUNNER_TEMP/identity-backup/export.sql"

      - name: Sanity gate — the export is a real snapshot
        run: |
          SQL="$RUNNER_TEMP/identity-backup/export.sql"
          if [ ! -s "$SQL" ]; then
            echo "::error::the export is empty"
            exit 1
          fi
          TABLES=$(grep -c 'CREATE TABLE' "$SQL" || true)
          if [ "$TABLES" -lt 1 ]; then
            echo "::error::the export carries no CREATE TABLE statements — not a registry snapshot"
            exit 1
          fi
          echo "export sanity: $(stat -c%s "$SQL") bytes, $TABLES CREATE TABLE statements"

      - name: Upload the timestamped key
        working-directory: browser
        run: |
          KEY="identity/$(date -u +%Y%m%d-%H%MZ).sql"
          echo "BACKUP_KEY=$KEY" >> "$GITHUB_ENV"
          npx wrangler r2 object put "$BACKUP_BUCKET/$KEY" --remote \
            --file "$RUNNER_TEMP/identity-backup/export.sql"
          echo "uploaded r2://$BACKUP_BUCKET/$KEY"

      - name: Verify — read the object back (byte length + byte-identical cmp)
        working-directory: browser
        run: |
          LOCAL=$(stat -c%s "$RUNNER_TEMP/identity-backup/export.sql")
          npx wrangler r2 object get "$BACKUP_BUCKET/$BACKUP_KEY" --remote \
            --file "$RUNNER_TEMP/identity-backup/readback.sql"
          REMOTE=$(stat -c%s "$RUNNER_TEMP/identity-backup/readback.sql")
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::the landed object is $REMOTE bytes, the upload was $LOCAL"
            exit 1
          fi
          cmp "$RUNNER_TEMP/identity-backup/export.sql" \
              "$RUNNER_TEMP/identity-backup/readback.sql"
          echo "read-back verified: $REMOTE bytes, byte-identical"

      - name: Retention posture — the bucket's lifecycle rule stands
        working-directory: browser
        # Retention is the one-time bucket rule, not this workflow; a
        # rule silently deleted would hoard snapshots forever. Listing
        # the rules every night makes that drift a red night.
        run: |
          npx wrangler r2 bucket lifecycle list "$BACKUP_BUCKET" | tee "$RUNNER_TEMP/identity-backup/lifecycle.txt"
          grep -q 'expire-30-days' "$RUNNER_TEMP/identity-backup/lifecycle.txt" \
            || { echo "::error::the expire-30-days lifecycle rule is MISSING from $BACKUP_BUCKET — re-apply per docs/deployment/identity-operations.md → Scheduled exports"; exit 1; }
          grep -q 'Expire objects after 30 days' "$RUNNER_TEMP/identity-backup/lifecycle.txt" \
            || { echo "::error::the lifecycle rule's action drifted from the 30-day expiry"; exit 1; }

  report-failure:
    # One honest summary per failed run (the heartbeat's pattern): the
    # standing issue gets the run link appended; the first failure
    # opens it. A red backup is never silent.
    if: failure()
    needs: [export]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post the failure summary
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Identity backup failing — the nightly D1 export to R2 is broken or unprovisioned'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The identity-backup run of ${new Date().toISOString()} failed: ${runUrl}\n\n`
              + 'The workflow (.github/workflows/identity-backup.yml) exports the live registry '
              + '(oiml-smart-platform-identity) to the R2 bucket oiml-identity-backups; retention is the '
              + 'bucket\'s expire-30-days lifecycle rule. The failing leg is named in the run log. If the '
              + 'guard leg failed, the one-time owner provisioning is incomplete: docs/deployment/'
              + 'identity-operations.md → "Scheduled exports" lists the bucket and the two secrets. The '
              + 'data-loss window until the fix is bounded by the last green night plus the quarterly '
              + 'restore drill.'
            const { data: listed } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const standing = listed.find(i => i.title === title && !i.pull_request)
            if (standing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: standing.number, body,
              })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
            }
