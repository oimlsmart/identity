name: identity-dr-drill

# The restore drill (docs/deployment/identity-operations.md → "Disaster
# recovery: the restore drill"), promoted to a dispatchable workflow:
# (the 2026-09-21 first attempt's failure was the missing --remote
# flag — wrangler read a local r2 state — not the token's scope, a
# diagnosis corrected by the backup workflow's own verify command). The procedure is
# the runbook's own, verbatim: fetch the LATEST backup's snapshot from
# R2, restore into a THROWAWAY scratch D1, compare the table SET + the
# per-table ROW COUNTS against the live registry, then destroy the
# scratch and leave nothing behind. The live database is NEVER written.
#
# Cadence: quarterly + before migration-carrying deploys (the runbook);
# dispatch manually (optionally with a specific snapshot key — default:
# the latest identity-backup run's).

on:
  workflow_dispatch:
    inputs:
      snapshot_key:
        description: "The R2 key to restore (identity/YYYYMMDD-HHMMZ.sql); empty = the latest backup run's"
        required: false
        default: ''
  workflow_call: {}

concurrency:
  group: identity-dr-drill
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: cloudflare-identity-backup
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_DB: oiml-smart-platform-identity
      BACKUP_BUCKET: oiml-identity-backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the snapshot key (the input, else the latest backup run's)
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_KEY: ${{ inputs.snapshot_key }}
        run: |
          if [ -n "$INPUT_KEY" ]; then
            echo "key=$INPUT_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID=$(gh run list --workflow identity-backup.yml --limit 5 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')
          KEY=$(gh run view "$RUN_ID" --log | grep -oE 'identity/[0-9]{8}-[0-9]{4}Z\.sql' | tail -1)
          echo "The latest successful backup ($RUN_ID) uploaded $KEY" >&2
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Fetch the snapshot from R2
        run: |
          # --remote is load-bearing: without it wrangler reads a LOCAL
          # r2 state and answers 'key does not exist' (the 2026-09-21
          # false diagnosis — the token was never the problem; the
          # backup workflow's own verify passes --remote).
          npx wrangler@4.125.0 r2 object get "$BACKUP_BUCKET/${{ steps.key.outputs.key }}" --remote \
            --file /tmp/dr-snapshot.sql
          test -s /tmp/dr-snapshot.sql

      - name: Create the scratch database (a throwaway — never the live one)
        id: scratch
        run: |
          SCRATCH="identity-dr-drill-${{ github.run_id }}"
          npx wrangler@4.125.0 d1 create "$SCRATCH" > /tmp/dr-create.json
          echo "name=$SCRATCH" >> "$GITHUB_OUTPUT"

      - name: Restore the snapshot into the scratch
        run: |
          npx wrangler@4.125.0 d1 execute "${{ steps.scratch.outputs.name }}" \
            --remote --file /tmp/dr-snapshot.sql -y

      - name: Compare — the table set, then the rowid-bounded row counts
        # The journal tables write continuously (~2 rows/min), so a
        # plain count diff can never be empty against a snapshot even
        # minutes old (the 2026-09-21 third run: 122 entities of drift
        # over 65 minutes — the runbook's "honest drift" made constant).
        # The sound proof is ROWID-BOUNDED: the snapshot's max rowid per
        # table is the boundary; live rows at-or-below it must equal the
        # restored count EXACTLY (appends above the boundary are the
        # post-snapshot writes, invisible to this comparison; a live
        # count BELOW means a snapshotted row was deleted since — rare,
        # and a legitimate re-run-with-fresh-snapshot case).
        run: |
          q() { # $1 = db, $2 = sql, extra args after
            local db="$1" sql="$2"; shift 2
            local args=(--remote --json)
            [ "$db" = "$LIVE_DB" ] && args+=(--env identity)
            npx wrangler@4.125.0 d1 execute "$db" "${args[@]}" --command "$sql" "$@" \
              | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!d[0]) { console.error("EMPTY RESULT"); process.exit(2) } console.log(JSON.stringify(d[0].results))'
          }
          # The table SET must match first (substr exclusion — see the
          # _cf_KV lesson).
          list_tables() {
            local db="$1"
            q "$db" "SELECT name FROM sqlite_master WHERE type='table' AND substr(name,1,7) != 'sqlite_' AND substr(name,1,4) != '_cf_' ORDER BY name" \
              | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).map(r=>r.name).join("\n"))'
          }
          cd browser
          live_tables=$(list_tables "$LIVE_DB")
          restored_tables=$(list_tables "${{ steps.scratch.outputs.name }}")
          diff <(printf '%s\n' "$live_tables") <(printf '%s\n' "$restored_tables") \
            || { echo "::error::the table SETS differ — schema drift the snapshot does not carry"; exit 1; }

          fail=0
          while IFS= read -r tbl; do
            restored=$(q "${{ steps.scratch.outputs.name }}" "SELECT COUNT(*) AS n, COALESCE(MAX(rowid),0) AS m FROM \"$tbl\"")
            n_r=$(printf '%s' "$restored" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].n)')
            m_r=$(printf '%s' "$restored" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].m)')
            n_l=$(q "$LIVE_DB" "SELECT COUNT(*) AS n FROM \"$tbl\" WHERE rowid <= $m_r" \
              | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].n)')
            if [ "$n_l" != "$n_r" ]; then
              echo "::error::$tbl: restored $n_r rows at rowid<=$m_r, live has $n_l — a snapshotted row was deleted, or the restore dropped rows"
              fail=1
            else
              echo "$tbl: $n_r rows (rowid<=$m_r) — identical"
            fi
          done <<< "$live_tables"
          [ "$fail" = 0 ] && echo "DRILL GREEN: table set + rowid-bounded row counts identical" || exit 1

      - name: Destroy the scratch (always — the drill leaves nothing behind)
        if: always() && steps.scratch.outputs.name != ''
        run: npx wrangler@4.125.0 d1 delete "${{ steps.scratch.outputs.name }}" --skip-confirmation

      - name: Clean the workspace
        if: always()
        run: rm -f /tmp/dr-snapshot.sql /tmp/dr-live.txt /tmp/dr-restored.txt /tmp/dr-create.json
