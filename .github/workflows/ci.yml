name: ci

# The identity service's trunk gates. Every push to main and every PR
# runs the AGENTS.md command gates. The deploy pipeline is
# deploy-identity.yml (tag-gated, never on branch pushes).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The platform-server kernel, the file: dependency target,
      # DECLARED at the position browser/package.json's
      # file:../x/oimlsmart/smart traversal resolves (the x/ doctrine —
      # the same layout the smart repo's CI uses for the SST positions).
      # Until the kernel's first npm publish lands, the identity repo
      # develops against the sibling checkout; at publish this checkout
      # retires and the dep flips to ^0.1.0. oimlsmart/smart is private:
      # the checkout rides a read-capable token (a dedicated
      # SMART_CHECKOUT_TOKEN when declared, the org PAT otherwise).
      - name: "Checkout the smart monorepo (the platform-server kernel's home)"
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          ref: v2
          path: x/oimlsmart/smart
          token: ${{ secrets.SMART_CHECKOUT_TOKEN || secrets.METANORMA_CI_PAT_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The kernel package's own node_modules — the file: link's
      # realpath chain (x/oimlsmart/smart/packages/platform-server/**)
      # never reaches browser/node_modules, so the package's imports
      # resolve from here.
      - name: Install the platform-server kernel package
        working-directory: x/oimlsmart/smart/packages/platform-server
        run: npm ci --no-audit --no-fund

      - name: Install dependencies
        working-directory: browser
        run: npm ci

      - name: Build (the astro production build)
        working-directory: browser
        run: npm run build

      - name: vue-tsc
        working-directory: browser
        run: npx vue-tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: astro check
        working-directory: browser
        run: npx astro check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: vitest (the unit suites)
        working-directory: browser
        run: npx vitest run

      - name: The OIDC-surface contract gate
        working-directory: browser
        run: npx vitest run --config vitest.e2e.config.ts e2e/op-surface-contract.e2e.ts

  bundle:
    # The deploy artifact's shape, proven without deploying: the Workers
    # bundle builds and the deploy composer writes the per-env configs
    # (the SAME composition the deploy-identity workflow consumes; the
    # wrangler deploy itself is the deliberate act, never CI's).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Checkout the smart monorepo (the platform-server kernel's home)"
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          ref: v2
          path: x/oimlsmart/smart
          token: ${{ secrets.SMART_CHECKOUT_TOKEN || secrets.METANORMA_CI_PAT_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform-server kernel package
        working-directory: x/oimlsmart/smart/packages/platform-server
        run: npm ci --no-audit --no-fund

      - name: Install dependencies
        working-directory: browser
        run: npm ci

      - name: Build the Workers bundle
        working-directory: browser
        run: npm run build:cloudflare

      - name: The bundle-shape dry legs (compose-only, nothing deploys)
        working-directory: browser
        run: |
          npx tsx scripts/deploy-instance.ts identity --compose-only
          npx tsx scripts/deploy-instance.ts identity-preview --compose-only

  identity-e2e:
    # The identity e2e legs: the shared dev stack for the runner's
    # per-file reset; the legs themselves self-contained on their own
    # ports (each boots its own API + astro + fixtures).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Checkout the smart monorepo (the platform-server kernel's home)"
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          ref: v2
          path: x/oimlsmart/smart
          token: ${{ secrets.SMART_CHECKOUT_TOKEN || secrets.METANORMA_CI_PAT_TOKEN }}
          persist-credentials: false

      # The same reclaim as the smart repo's CI (the 2026-08-23 "Free
      # space left: 1 MB" lesson): npm ci's + a Chrome + the dev stacks'
      # caches ride the ever-growing ubuntu-latest image.
      - name: Free disk space (unused runner-image toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /opt/microsoft
          sudo docker system prune -af --volumes || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the platform-server kernel package
        working-directory: x/oimlsmart/smart/packages/platform-server
        run: npm ci --no-audit --no-fund

      - name: Install dependencies
        working-directory: browser
        run: npm ci

      - name: Install Chromium for puppeteer
        working-directory: browser
        run: npx puppeteer browsers install chrome

      - name: Dev server
        working-directory: browser
        run: |
          npm run dev &
          npx wait-on http://localhost:5190/ http://localhost:5190/api/health --timeout 300000
        env:
          ENTITY_BACKEND: server
          # The suite stack keeps the demo cast (the identity legs boot
          # their own stacks and scrub the posture).
          DEMO_ACCOUNTS_ENABLED: 'true'

      - name: The identity e2e legs
        working-directory: browser
        run: |
          npx tsx scripts/e2e-run.ts \
            e2e/id-01-op.e2e.ts \
            e2e/id-02-accounts.e2e.ts \
            e2e/id-03-registry.e2e.ts \
            e2e/id-04-op-side.e2e.ts \
            e2e/id-05-full.e2e.ts \
            e2e/id-06-account-console.e2e.ts \
            e2e/id-07-registry.e2e.ts \
            e2e/id-08-upstream.e2e.ts \
            e2e/id-09-email.e2e.ts \
            e2e/id-10-org-admin.e2e.ts \
            e2e/id-11-home.e2e.ts \
            e2e/id-14-factors.e2e.ts \
            e2e/id-15-mobile-viewport.e2e.ts \
            e2e/id-16-selfhost.e2e.ts \
            e2e/id-17-manufacturer-kind.e2e.ts \
            e2e/id-18-org-signing-keys.e2e.ts \
            e2e/id-surface.e2e.ts \
            e2e/op-surface-contract.e2e.ts \
            e2e/op-key-rotate.e2e.ts
