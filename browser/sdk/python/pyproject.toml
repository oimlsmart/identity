[project]
name = "oiml-smart-identity"
version = "1.0.0-edition1"
description = "The Python SDK for the OIML SMART Identity service"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
# The DPoP middleware (RFC 9449) needs EC signing — the base
# requirements stay untouched; the feature is an opt-in extra.
dpop = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
