# ─────────────────────────────────────────────────────────────────────
# The Cloudflare deployment of the identity service (the OIDC Provider
# at id.oimlsmart.org). Build with `ADAPTER=cloudflare npm run
# build:cloudflare`, run locally with `npm run dev:cloudflare`, deploy
# ONLY through the tag-gated deploy-identity workflow (the deliberate
# act, docs/deployment/identity-deploy.md).
#
# `main` is deliberately ABSENT: the @astrojs/cloudflare vite plugin
# injects its own worker entry at dev/build time, and the build emits a
# COMPLETE generated config at dist/server/wrangler.json (entry +
# assets + these bindings carried over). `wrangler dev` / the deploy
# composer (scripts/deploy-instance.ts) run against that generated
# config, so one source config serves both.
#
# MIGRATION DISCIPLINE (the extraction's risk 1): the D1 below IS the
# live account registry — it never moves. Since the wave-03 cutover
# (2026-08-24, tag id-v2026.08.24-1) it is owned by THIS repo's
# deployment alone (the monorepo's OP code is inert pending wave 04).
# TODO.repos/01: the migration set ships in the kernel package
# (node_modules/@oimlsmart/platform-server/migrations — wrangler keys
# the bookkeeping on FILENAMES, and the names never changed across the
# move); future files append expand-only, never renumber.
# ─────────────────────────────────────────────────────────────────────

# The DEFAULT env is the dev posture (local `wrangler dev` against the
# miniflare-local D1; deploys never target it — the deploy gate names
# --env identity / --env identity-preview explicitly). OP_ISSUER is
# deliberately unset here: a dev posture derives the issuer from the
# request origin (server/auth/op/config.ts).
name = "oiml-smart-platform-identity-dev"
compatibility_date = "2026-04-15"
workers_dev = true
# The node-only audit (the same doctrine as the monorepo's deployment,
# docs/deployment/cloudflare.md there): the API graph (server/*.ts)
# carries no node built-ins; better-sqlite3 stays behind the kernel's
# store seam, node-only. nodejs_compat covers the Astro SSR page graph.
compatibility_flags = ["nodejs_compat"]

[assets]
# The Astro build's static half (dist holds both _worker.js and the
# client assets); the adapter's generated worker serves them through
# this binding.
directory = "dist"
binding = "ASSETS"

# The dev D1: local `wrangler dev` serves a miniflare-local database
# under this binding; the database_id names the LIVE registry so a
# deliberate `--remote` session reads it (never write against it from
# a dev posture). Apply the schema locally with:
#   npx wrangler d1 migrations apply oiml-smart-platform-identity --local
[[d1_databases]]
binding = "DB"
database_name = "oiml-smart-platform-identity"
database_id = "6d24ab5f-f275-472f-82b1-fd0e3ca6ed96" # created 2026-08-16 via `wrangler d1 create`
migrations_dir = "node_modules/@oimlsmart/platform-server/migrations"

[vars]
ENTITY_BACKEND = "server"
# The identity profile, dev posture: the demo cast ON so the local stack
# signs in without an OP_ACCOUNT_SEED. EMAIL_FROM is inert until a mail
# provider is configured (see the commented blocks on [env.identity]).
INSTANCE_PROFILE_YAML = '''
identity:
  org_id: oimlsmart-id
  org_name: OIML SMART Identity
  role_codes: [identity]
roles: [identity]
branding:
  name: OIML SMART Identity
demo_personas: true
'''

# ── The identity service (TODO.identity/01) — id.oimlsmart.org ───────
# The OIDC Provider: roles: [identity] gates the OP endpoints on
# (discovery, JWKS, authorize/consent, token, userinfo + the client
# registry). Its own D1 (the OP state must never share a database with
# an instance). This env block is the monorepo's, moved VERBATIM (the
# wave-03 cutover deploys to the SAME worker over the SAME database).
[env.identity]
name = "oiml-smart-platform-identity"

[[env.identity.d1_databases]]
binding = "DB"
database_name = "oiml-smart-platform-identity"
database_id = "6d24ab5f-f275-472f-82b1-fd0e3ca6ed96" # created 2026-08-16 via `wrangler d1 create`
migrations_dir = "node_modules/@oimlsmart/platform-server/migrations"

# TODO.identity/09 — transactional email. TWO provider postures:
#   1. the Cloudflare Email Service — the binding below, live once the
#      account's email-sending access is on and the oimlsmart.org
#      domain authentication (SPF/DKIM/DMARC) is complete
#      (docs/deployment/identity.md → "Transactional email"). Deploying
#      with the binding active BEFORE the account access exists would
#      fail the deploy.
#   2. the HTTPS provider fallback — MAIL_PROVIDER_URL below + the key
#      as a secret (`wrangler secret put MAIL_PROVIDER_KEY --env
#      identity`). Uncomment the URL when the key is set.
# With neither configured the mailer is an honest no-op: messages are
# logged and the invite/reset flows keep showing their setup links.
[[env.identity.send_email]]
name = "EMAIL"

# The account-avatar uploads (the account console's "Change the picture")
# ride the blob-store seam (server/blobs.ts): R2 here, disk on node.
# The bucket exists (oiml-smart-avatars-identity). If the binding is
# ever removed, the feature degrades honestly: the upload routes answer
# 503 and the console shows the linked-provider picture or the initials
# (the account page says so). The 2 MiB cap + the PNG/JPEG/WebP/GIF
# allowlist hold either way (server/auth/op/avatars.ts;
# AVATAR_MAX_BYTES overrides).
[[env.identity.r2_buckets]]
binding = "BLOBS"
bucket_name = "oiml-smart-avatars-identity"

# NOTE: production deliberately declares NO ENVIRONMENT_LABEL — the
# ribbon (the ISO-benchmark quick win, item 5) shows only where a
# posture names itself (the preview, below).

[env.identity.vars]
ENTITY_BACKEND = "server"
OP_ISSUER = "https://id.oimlsmart.org"
# The support affordance (the ISO-benchmark quick win, item 6): the
# sign-in page + the shell footer render a plain "Need help?" link —
# never a third-party widget on the credential surface. The address is
# the estate's published contact (www.oimlsmart.org/privacy).
SUPPORT_URL = "mailto:info@oimlsmart.org"
# TODO.identity/09: the sender identity for both mail postures. Inert
# until a provider is configured (see the commented blocks above).
EMAIL_FROM = "OIML SMART Identity <no-reply@oimlsmart.org>"
# MAIL_PROVIDER_URL = "https://api.resend.com/emails"
# The estate status probe's recognition token (server/auth/op/probe.ts):
# the status service's sign-in probe presents it as the X-OIML-Probe
# header so its exercised invalid-credentials checks audit as the honest
# account.sign_in_probe (excluded from the feeds + the burst signal)
# instead of account.sign_in_failed. The SAME value is a Worker secret
# on BOTH workers (oimlsmart/status's prober too), set with:
#   npx wrangler secret put STATUS_PROBE_TOKEN --env identity
# Unset, the recognition is off entirely — every caller is a normal
# caller and the probe's rows land as ordinary sign_in_failed.
INSTANCE_PROFILE_YAML = '''
identity:
  org_id: oimlsmart-id
  org_name: OIML SMART Identity
  role_codes: [identity]
roles: [identity]
branding:
  name: OIML SMART Identity
demo_personas: false
'''

# ── The identity PREVIEW (TODO.identity-ops/01) — id-preview.oimlsmart.org ──
# The deploy gate's staged rollout (docs/deployment/identity-deploy.md):
# an id-v* tag deploys HERE first, the OIDC-surface probe proves it, and
# production follows on the environment's manual approval. The preview
# keeps demo_personas: true so the claims legs of the surface probe can
# run a full round trip against it when the fixture credentials are
# declared; production never carries the cast.
[env.identity-preview]
name = "oiml-smart-platform-identity-preview"

[[env.identity-preview.d1_databases]]
binding = "DB"
database_name = "oiml-smart-platform-identity-preview"
# The one-time setup is DONE (2026-08-24, the wave-03 deploy prep):
# the database below was created with `wrangler d1 create
# oiml-smart-platform-identity-preview`; the workflow's
# IDENTITY_PREVIEW_URL var completes the posture.
database_id = "d88056fc-cff7-48c6-9a67-8f7c817ed248"
migrations_dir = "node_modules/@oimlsmart/platform-server/migrations"

[env.identity-preview.vars]
ENTITY_BACKEND = "server"
OP_ISSUER = "https://id-preview.oimlsmart.org"
SUPPORT_URL = "mailto:info@oimlsmart.org"
# The environment ribbon (item 5): the preview names itself, so every
# page carries the thin "Preview" strip; production (above) shows none.
ENVIRONMENT_LABEL = "Preview"
EMAIL_FROM = "OIML SMART Identity <no-reply@oimlsmart.org>"
INSTANCE_PROFILE_YAML = '''
identity:
  org_id: oimlsmart-id
  org_name: OIML SMART Identity
  role_codes: [identity]
roles: [identity]
branding:
  name: OIML SMART Identity (preview)
demo_personas: true
'''
