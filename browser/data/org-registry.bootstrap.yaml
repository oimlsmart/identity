# ═══════════════════════════════════════════════════════════════════
# THE PRODUCTION PARTICIPANT BOOTSTRAP (TODO.identity-features/10,
# consequence 5): the authoritative OIML directory as identity-registry
# rows on the corrected member model. This is the feed the registry's
# production posture boots from — the registry starts EMPTY (migration
# 0013's doctrine) and the identity administrator populates it
# deliberately; THIS dataset is that deliberate act, applied through
# the importer (server/import-org-registry.ts, driven by
# scripts/import-org-registry.ts — the runbook section is
# docs/deployment/identity-operations.md).
#
# It is NOT the dev/e2e demonstration register: org-register.snapshot.yaml
# stays the FICTIONAL cast (Example orgs at example.org) and is untouched.
#
# THE MODEL (the corrected member model): the OIML Member category is
# the member-state / corresponding-member kinds; a member state
# participates in the OIML-CS by PROPOSING its issuing authorities (the
# IA row's proposed_by) and DESIGNATING utilizers (the utilizer row's
# designated_by); a corresponding member designates ASSOCIATES; a test
# laboratory carries its IA association (designated_by → the IA). The
# designated bodies (utilizer/associate) carry the CS status facet (the
# Declaration's standing). The link's kind enforcement is the write
# path's (validateOrgLinks, server/auth/org-registry.ts) — the importer
# drives exactly it.
#
# THE SOURCES (all fetched 2026-08-29; the per-row provenance.source
# names each row's primary source):
#   - the Member States list   https://www.oiml.org/en/structure/members/member-states
#     (63 rows; the per-country detail pages carry the member body)
#   - the Corresponding Members https://www.oiml.org/en/structure/members/corresponding-members
#     (66 rows; ditto)
#   - the IA summary table      https://www.oiml.org/en/oiml-cs/docs/oiml-ia-summary-table.pdf
#     (dated 2026-08-27; 14 issuing authorities with their OIML codes)
#   - the TL summary table      https://www.oiml.org/en/oiml-cs/docs/tl-summary-table.pdf
#     (dated 2026-04-16; 32 test-laboratory associations)
#   - the Utilizer/Associate    https://www.oiml.org/en/oiml-cs/docs/oiml-util-and-assoc-summary-table.pdf
#     summary table (dated 2026-05-19; 31 utilizers + 11 associates)
#
# THE HONEST GAPS + DISAMBIGUATIONS:
#   - CONTACTS: the oiml.org detail pages publish contact details behind
#     a login ("Login to see contact details") — the rows carry NO
#     contacts, honestly. The identity administrator curates them at the
#     first verified interaction (the email-domain hint derives then).
#   - TL COUNTRIES: the TL summary states no country for third-party
#     laboratories — those rows carry country: null (unrecorded). The
#     IA-internal laboratories carry the IA's member state.
#   - RU utilizer: the member page (fetched 2026-08-29) lists
#     RCAM-Rostest; the 2026-05-19 summary table still lists VNIIMS.
#     The live page wins; the row's note records the discrepancy.
#   - IT issuing authority: the 2026-08-27 IA summary lists Tifernogas
#     as IT2 (the former IT1, the ministry, is no longer listed); the
#     older TL summary still captions it IT1.
#   - The 2025-04 OIML Bulletin ("Celebrating 70 years") says 64 Member
#     States; the live directory lists 63 — the directory wins.
#   - The FORCE laboratories' cities lost their ø glyph in the TL
#     summary's text layer ("Brondby"/"Horsholm"); the spellings here
#     (Brøndby, Hørsholm) follow FORCE's own site.
#   - Three member_body values (the informational field only) carry the
#     source pages' own artifacts, restored: Monaco's page literally
#     serves "l?Equipement" (the É lost upstream), Trinidad and
#     Tobago's block names the TTBS's Legal Metrology Inspectorate
#     without an institute line, Ukraine's doubles its quotes.
#
# THE CONVENTIONS:
#   - ids: ms-<cc> / cm-<cc> for the members (the OIML site code), the
#     OIML code for an IA (the participant org's id IS its code — the
#     registry's §4 doctrine), tl-<ia>-<slug> for a test laboratory
#     (TLs carry no public OIML code), ut-<cc> / as-<cc> for the
#     designated bodies (ut-it-* splits Italy's two utilizers).
#   - every listed utilizer/associate is a SIGNED, ACTIVE Declaration
#     holder (the listing IS that fact) — cs_status: signed-active.
#   - one row per (TL, IA) association: a laboratory associated with
#     two IAs (Mettler Toledo, Sartorius, Sensus, Endress+Hauser
#     Flowtec under CH1 and DE1) is two LINKED rows, never merged —
#     the inclusion is per-IA (PD-04).
#   - provenance rides every row (source URL + the per-country detail
#     page); member_body is the informational member-body name from the
#     country's detail page (never projected into the registry row).
# ═══════════════════════════════════════════════════════════════════

